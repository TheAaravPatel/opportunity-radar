# =============================================================================
# Early-career program registry  (spec Section 1B)
# =============================================================================
# Insight days, discovery programs, summits, fellowships and paid pre-internships
# built for first- and second-year students, plus "pipeline" organizations that
# place students with many employers.
#
# These programs get renamed or discontinued a lot, so NEVER delete an entry:
# set `status_hint: possibly discontinued` (or `discontinued`) instead. That way
# the history stays and the dashboard can tell you it's gone.
#
# Fields (only id, firm, program, url are required):
#   id                  unique slug, lowercase-with-dashes. Don't change it later
#                       (it links the entry to its history in the database).
#   firm                organization that runs the program
#   program             official program name (update if it gets renamed)
#   aka                 other / former names (also used to match job postings)
#   type                "early-career program" (default) or "pipeline program"
#   fields              any of: cs, econ, biotech   (econ = econ / finance / consulting)
#   class_years         who can apply, using your CURRENT year at application time:
#                       freshman, sophomore, junior, senior. (A summer program for
#                       "rising sophomores" is applied to as a freshman -> freshman.)
#   format              insight day | summit | virtual series | paid summer |
#                       fellowship | conference | membership
#   location            where it happens ("virtual" if online)
#   url                 official program page. The page-watcher checks it daily.
#   typical_open_month  1-12: month applications usually open (estimates are fine).
#                       Drives the "expected soon" status and the digest's
#                       "usually opens in 2 weeks" warning.
#   status_hint         active | renamed | possibly discontinued | discontinued
#   deadlines           list of {kind, date, label, approx}
#                       kind: opens | application | priority | event
#                       approx: true when the date is an estimate
#   notes               anything else worth knowing
#   last_verified       when/how this entry was last checked
#
# Seeded 2026-11-24 from web research (official pages + student trackers such as
# Extern/Prospect Rock). "verified-search" = confirmed via search results, not by
# loading the page; the verify workflow loads every URL for real.
# =============================================================================

