# =============================================================================
# Keyword rules: field classification, eligibility scoring, early-career detection
# =============================================================================
# Patterns are matched case-insensitively against whole words, so "ai" will not
# match "maintain". Write plain words/phrases; regex is allowed for the
# eligibility `pattern` entries (advanced).
# =============================================================================

