# Eligibility scoring. Every item starts at `base` points; matching rules add
# or subtract points and the reason is shown on the dashboard. Class-year and
# graduation-year logic is computed in radar/eligibility.py from your
# grad_year (settings.yaml), so it adjusts automatically each school year.
eligibility:
  base: 50
  no_class_year_bonus: 10        # nothing says who can apply -> probably open
  your_year_bonus: 30            # explicitly open to your current class year
  next_year_bonus: 5             # open to next year's class (plan ahead)
  other_years_penalty: -25       # only for class years other than yours
  grad_window_bonus: 25          # graduation window includes your year
  grad_too_early_penalty: -30    # must graduate before you will
  rules:
    - pattern: '\ball (undergraduate|undergrad|class) (students|years)\b|\bany (class )?year\b|\ball years\b|\ball undergraduates\b|\bopen to all (stanford )?undergrad'
      points: 15
      reason: Open to all undergraduates
    - pattern: '\b(ph\.?\s?d|doctoral|postdoc|post-doc|postdoctoral)\b'
      points: -30
      reason: PhD-level role
    - pattern: "\\b(master'?s|mba|m\\.s\\.|ms student|graduate students?|grad students?)\\b"
      points: -25
      reason: For graduate students
    - pattern: '\b(non-stanford|other (universities|institutions|schools)|outside (of )?stanford|not (currently )?(enrolled|attending) (at )?stanford)\b'
      points: -40
      reason: For non-Stanford students only
    - pattern: '\bstanford (students|undergraduates|undergrads)\b'
      points: 5
      reason: For Stanford students
    - pattern: '\b(new grad|new graduate|entry[- ]level|full[- ]time (role|position))\b'
      points: -20
      reason: Full-time / new-grad role, not an internship
    - pattern: '\b(high school|high-school|middle school|k-12|grades? (9|10|11|12))\b'
      points: -40
      reason: For high school students
    - pattern: "\\b(post-?baccalaureate|already have a bachelor'?s degree|bachelor'?s degree (is )?required|recent (college )?graduates)\\b"
      points: -30
      reason: For college graduates (needs a bachelor's degree)

# Words that mark a posting as an early-career (freshman/sophomore) program.
# Used to flag postings in every job feed and match them to the registry.
#   strong: count on their own ("Sophomore Summer Analyst", "Early Insights")
#   weak:   too common alone ("Market Research Insights Intern" isn't a program),
#           so they only count when the title also has a program word
#           ("Insight Day", "Discovery Program", "Explore Series") or a strong word.
early_career:
  strong:
    - sophomore
    - sophomores
    - freshman
    - freshmen
    - first-year
    - first year
    - second-year
    - second year
    - underclassmen
    - underclassman
    - pre-internship
    - early insights
    - early insight
    - early identification
    - early id
    - graduating 2029
    - graduating 2030
    - class of 2029
    - class of 2030
  weak:
    - insight
    - insights
    - discovery
    - discover
    - explore
    - immersion
    - summit
    - academy
    - kickstart
    - fellowship
  program_words:
    - program
    - programme
    - day
    - days
    - series
    - event
    - week
    - forum
    - experience
    - conference

# Travel rule (settings.yaml -> travel). Outside the Bay Area and Chicagoland,
# an opportunity only fits if it pays for BOTH housing and travel. These
# phrases are looked for in descriptions, notes and scholarship details.
# "...not provided" / "no relocation" style negations are ignored automatically.
travel:
  both:        # one phrase is enough: housing AND travel are covered
    - relocation assistance
    - relocation stipend
    - relocation package
    - relocation support
    - relocation bonus
    - relocation benefits
    - corporate housing
    - company-provided housing
    - housing and travel
    - travel and housing
    - travel and lodging
    - travel and accommodation
    - travel and accommodations
    - lodging and travel
    - flights and housing
    - airfare and lodging
    - airfare and housing
    - travel, lodging
    - travel, housing
    - all expenses paid
    - all-expenses-paid
    - all expenses covered
    - fully funded
    - fully-funded
    - room and board
    - travel covered
    - travel is covered
  housing:     # housing only - counts as "covered" only together with a travel phrase
    - housing stipend
    - housing allowance
    - housing assistance
    - housing provided
    - housing is provided
    - free housing
    - lodging
    - hotel
    - hotel nights
    - accommodation
    - accommodations
    - shared housing
  travel:      # travel only - counts as "covered" only together with a housing phrase
    - travel stipend
    - travel reimbursement
    - travel reimbursed
    - travel grant
    - travel award
    - travel awards
    - travel scholarship
    - travel scholarships
    - airfare
    - flights
    - flight
    - round-trip travel
