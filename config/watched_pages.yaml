# =============================================================================
# Watched Stanford pages  (spec Section 2)
# =============================================================================
# Pages that post once or a few times a year and are deadline-driven. The shared
# page-watcher checks each one daily: it stores a text snapshot, saves a readable
# diff when the page changes, and pulls out deadlines.
#
# Fields (only id, name, url are required):
#   id           unique slug; don't change it later
#   name         program / page name shown on the dashboard
#   org          office or department running it
#   url          the exact page to watch. Prefer pages whose address stays the
#                same every year (application pages often move: usrp2026 -> usrp2027)
#   type         research program | fellowship | RA | grant
#   fields       any of: cs, econ, biotech
#   class_years  who can apply (your CURRENT year when applying); [] = no limit found
#   render       auto (default: try a plain request, use a browser if the page is
#                empty) | http | playwright (always use a headless browser)
#   deadlines    known deadlines: {kind, date, label, approx}. The watcher adds
#                more as it finds them.
#   status_hint  active | stale | possibly discontinued
#   notes        anything else
#   watch        false -> the page-watcher skips it (blocks bots / needs login);
#                its known deadlines still show up
#   watch_note   why it isn't watched
#
# Seeded 2026-11-24 via web search; the verify workflow loads each URL for real.
# Login-only pages (e.g. the bsurp.stanford.edu project list) are deliberately
# NOT listed - we never fetch anything behind Stanford login.
# =============================================================================

