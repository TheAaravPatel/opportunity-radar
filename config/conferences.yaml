# =============================================================================
# Conference registry  (spec Section 3)
# =============================================================================
# Conferences, hackathons and travel scholarships worth tracking by hand. For
# freshmen the TRAVEL SCHOLARSHIP is usually what matters, and its deadline is
# often months before the conference, so dates and deadlines are tracked
# separately. (Entries are filled in below; see docs/SOURCES.md for sources.)
#
# Fields (only id, name, url are required):
#   id                  unique slug; don't change it later
#   name                official name (no year)
#   key_name            optional: name used to match the same event in other feeds
#   aka                 other names feeds use for it (they merge into this entry)
#   type                conference | hackathon | travel scholarship
#   fields              any of: cs, econ, biotech
#   start, end          event dates (YYYY-MM-DD); leave out if not announced
#   typical_month       1-12: month it's usually held (shown when dates are TBA)
#   location            "City, ST" or "virtual"
#   virtual             true if online
#   cost                free | scholarship | student | full | unknown
#   cost_note           e.g. "$100 student registration"
#   travel_scholarship  true / false
#   scholarship_covers  what the scholarship pays for
#   undergrad_eligible  true / false
#   poster_track        true if undergrads can present a poster / talk
#   class_years         [] = any year; otherwise freshman / sophomore / junior / senior
#   deadlines           list of {kind, date, label, approx}
#                       kind: scholarship | abstract | registration | application | opens
#   status_hint         active | cancelled | possibly discontinued
#   notes               anything else
#   watch, watch_note   false -> page-watcher skips it (blocks bots / login)
#   last_verified       when/how this entry was checked
# =============================================================================

