# =============================================================================
# Sources: every feed the radar reads
# =============================================================================
# Each entry is   <source id>:  {type, group, enabled, ...options}
#   type     which module in radar/sources/ handles it (its @register name)
#   group    when it runs: "jobs" (every 6 hours), "daily" (each morning), or a
#            list like [jobs, daily] for both
#   enabled  false -> skipped (kept for reference)
#   name     display name on the dashboard; homepage = credit/info link
# Adding a source = write one module in radar/sources/ + add one entry here.
# =============================================================================

sources:

  # ------------------------------------------------ CS / data / AI / quant ----
  simplify:
    type: listings_json
    group: jobs
    name: SimplifyJobs Summer 2027 Internships
    homepage: https://github.com/SimplifyJobs/Summer2027-Internships
    # The underlying data file on the dev branch: Summer AND Off-Season listings.
    url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
    # Map the repo's categories to our fields (cs / econ / biotech).
    fields_by_category:
      Software: [cs]
      Software Engineering: [cs]
      AI/ML/Data: [cs]
      "Data Science, AI & Machine Learning": [cs]
      Hardware: [cs]
      Product: [cs]
      Product Management: [cs]
      Quant: [cs, econ]
      Quantitative Finance: [cs, econ]
    default_fields: [cs]

  zshah101:
    type: zshah_jobs
    group: jobs
    name: zshah101 automated tech internships
    homepage: https://github.com/zshah101/Automated-List-Of-Summer-2027-and-Fall-2026-Tech-Internships
    # Its JSON API on GitHub Pages; the same file in the repo is the fallback.
    url: https://zshah101.github.io/Automated-List-Of-Summer-2027-and-Fall-2026-Tech-Internships/api/jobs.json
    fallback_url: https://raw.githubusercontent.com/zshah101/Automated-List-Of-Summer-2027-and-Fall-2026-Tech-Internships/main/docs/api/jobs.json
    fields_by_category:
      Software: [cs]
      "Data & ML/AI": [cs]
      Security: [cs]
      Hardware: [cs]
      Quant: [cs, econ]
      Other: []
    default_fields: [cs]

  jobseveryhour:
    type: jobseveryhour
    group: jobs
    name: Jobs Every Hour - tech internships
    homepage: https://jobseveryhour.com/
    url: https://jobseveryhour.com/api/v1/lists/tech-internships.json
    # They ask for a link back; this line appears in the dashboard footer.
    credit: "Tech internship listings courtesy of Jobs Every Hour:"
    default_fields: [cs]
    # The feed only lists the ~300 NEWEST jobs, so a job dropping out of it
    # hasn't necessarily closed. Keep it open until it's been gone 21 days.
    keep_missing_days: 21

  # ------------------------------------------------------- biotech / life sci ----
  biotech_repo:
    type: listings_json
    group: jobs
    name: vinaynarahari Summer 2027 Biotech Internships
    homepage: https://github.com/vinaynarahari/Summer2027-Biotech-Internships
    # Same format as Simplify. Off-season rows ("Co-op / Off-Cycle") are in the same file.
    url: https://raw.githubusercontent.com/vinaynarahari/Summer2027-Biotech-Internships/main/.github/scripts/listings.json
    fields_by_category:
      "Computational Biology, Data & AI": [biotech, cs]
      "Research & Lab Science": [biotech]
      "Clinical, Regulatory & Medical Affairs": [biotech]
      "Engineering, Manufacturing & Quality": [biotech]
      # Strategy/finance/consulting titles also get "econ" from the keyword rules.
      "Business, Commercial & Operations": [biotech]
    default_fields: [biotech]

  biotech_companies:
    type: ats_companies
    group: jobs
    name: Bay Area biotech job boards (config/companies.yaml)
    groups: [biotech]
    # Skip any company the biotech repo has started polling itself.
    skip_if_covered_by: https://raw.githubusercontent.com/vinaynarahari/Summer2027-Biotech-Internships/main/companies.json

  # ------------------------------------------------------ Stanford + registry ----
  # These read our own YAML registries so their known deadlines show up right
  # away. (The page-watcher that checks the pages themselves comes later.)
  # They only read local files, so they run with every workflow: statuses like
  # "opening soon" stay current and every dashboard build includes them.
  stanford_pages:
    type: watched_pages_registry
    group: [jobs, daily]
    name: Watched Stanford pages (config/watched_pages.yaml)
    file: watched_pages.yaml

  # Checks the pages in watched_pages.yaml themselves: page-changed alerts and
  # deadlines read off each page. Listed after stanford_pages so the
  # registry's entry owns each card's details.
  page_watcher:
    type: page_watcher
    group: daily
    name: Page-watcher (Stanford pages + employer job pages)
    homepage: https://github.com/TheAaravPatel/opportunity-radar/blob/HEAD/config/watched_pages.yaml
    file: watched_pages.yaml

  early_programs:
    type: early_programs_registry
    group: [jobs, daily]
    name: Early-career program registry (config/early_programs.yaml)
    file: early_programs.yaml

  # ------------------------------------------- conferences, hackathons, scholarships ----
  # The registry is listed first so that when the same conference also comes
  # from a feed, our hand-checked entry owns the dashboard details (the feed's
  # deadlines are still added to it).
  conference_registry:
    type: conferences_registry
    group: [jobs, daily]
    name: Conference registry (config/conferences.yaml)
    file: conferences.yaml

  student_opportunities:
    type: student_opportunities
    group: [jobs, daily]
    name: gkarpe2204 student conferences & hackathons
    homepage: https://github.com/gkarpe2204/student-opportunities
    url: https://raw.githubusercontent.com/gkarpe2204/student-opportunities/main/data/conferences.json
    fallback_url: https://gkarpe2204.github.io/student-opportunities/conferences.json

  badgeup:
    type: badgeup_readme
    group: [jobs, daily]
    name: BadgeUp undergrad conferences (stale - seed only)
    homepage: https://github.com/Jose-Gael-Cruz-Lopez/BadgeUp
    url: https://raw.githubusercontent.com/Jose-Gael-Cruz-Lopez/BadgeUp/main/README.md
    repo: Jose-Gael-Cruz-Lopez/BadgeUp

  # ----------------------------------------------------------------- economics ----
  predoc_ra:
    type: predoc
    group: daily
    name: PREDOC part-time & summer RA opportunities
    homepage: https://www.predoc.org/ra-opportunities
    url: https://www.predoc.org/ra-opportunities
    fields: [econ]

  predoc_fulltime:
    type: predoc
    group: daily
    enabled: false          # full-time post-BA predoc jobs - turn on senior year
    name: PREDOC full-time predoctoral positions
    homepage: https://www.predoc.org/opportunities
    url: https://www.predoc.org/opportunities
    fields: [econ]

  econ_companies:
    type: ats_companies
    group: jobs
    name: Econ consulting, policy & Fed job boards (config/companies.yaml)
    groups: [econ]

  usajobs:
    type: usajobs
    group: daily
    name: USAJobs - federal student economics roles
    homepage: https://www.usajobs.gov/
    # Waits (doesn't fail) until both GitHub Secrets are added.
    requires_env: [USAJOBS_API_KEY, USAJOBS_EMAIL]

  econ_ug_blog:
    type: rss_feed
    group: daily
    name: Econ UG Blog (UC San Diego economics opportunities)
    homepage: https://econugblog.wordpress.com/
    url: https://econugblog.wordpress.com/feed/
    fields: [econ]
    org_fallback: Econ UG Blog post
    title_must_match: "intern|research assistant|\\bra\\b|predoc|fellow|scholar|program|challenge|competition|conference|summit|insight|analyst"
    # It's UC San Diego's blog: drop its campus-only events and info sessions.
    title_must_not_match: "UC San Diego|UCSD|Triton|info session|information session|webinar|workshop"
    max_age_days: 60
    keep_missing_days: 60   # the feed only shows its latest ~10 posts

  economic_misfit:
    type: rss_feed
    group: daily
    name: The Economic Misfit (econ RA / predoc posts)
    homepage: https://theeconomicmisfit.com/
    url: https://theeconomicmisfit.com/feed/
    fields: [econ]
    org_fallback: Economic Misfit post
    # Mostly research articles and postdoc jobs - keep only student-level posts.
    title_must_match: "research assistant|\\bra\\b|predoc|pre-doc|intern|undergrad|summer"
    title_must_not_match: "postdoc|post-doc|faculty|professor"
    max_age_days: 60
    keep_missing_days: 60

  appliedeconjobs:
    type: rss_feed
    group: daily
    enabled: false          # Substack's bot protection blocks GitHub's servers (checked 2026-11-24)
    name: Applied Econ Jobs (Substack)
    homepage: https://appliedeconjobs.substack.com/
    url: https://appliedeconjobs.substack.com/feed
    fields: [econ]

  econjobmarket:
    type: econjobmarket
    group: daily
    enabled: false          # EJM's terms: ask EJM before re-displaying ads publicly
    name: EconJobMarket (official JSON feed; pre-doc / RA ads only)
    homepage: https://econjobmarket.org/market
    url: https://backend.econjobmarket.org/data/zz_public/json/Ads

