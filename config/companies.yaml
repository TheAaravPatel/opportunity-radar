# =============================================================================
# Companies polled directly through their public job-board (ATS) APIs
# =============================================================================
# Only list companies that the GitHub sources DON'T already cover. (A test checks
# the biotech list against vinaynarahari/Summer2027-Biotech-Internships'
# companies.json so we never poll the same board twice.)
#
# Fields:
#   name     company name as shown on the dashboard
#   ats      greenhouse | lever | ashby | workday | oracle | unknown
#            greenhouse / lever / ashby  -> slug   (boards-api.greenhouse.io/v1/boards/<slug>)
#            workday -> tenant, host (wd1, wd5, ...), site, optional domain
#                       (default myworkdayjobs.com; the Fed Board uses myworkdayjobsgov.com)
#            oracle  -> host, site     (Oracle Recruiting Cloud "CX" sites)
#            unknown -> not polled yet; listed so we remember to find its ATS
#   group    which part of the spec it serves: biotech | econ | early-career
#   fields   any of: cs, econ, biotech
#   search   keywords used to filter titles (Workday/Oracle send them as the search
#            text; others filter locally). Default: [intern]
#   early_career_only  true -> keep only postings matching early-career keywords
#   extra_titles       also keep titles containing these (e.g. research assistant)
#   skip_titles        drop titles containing these (roles outside your fields)
#   title_org_map      {text in title: real employer} for shared boards (the Fed)
#   location_map       {board's location text: real city} ("Federal Reserve Board" -> DC)
#   enabled  false -> skip (keeps the entry for reference)
#   notes    why it's here / anything odd
#
# WORKDAY WARNING: Workday's Cloudflare blocks *heavy* pollers from GitHub Actions
# (another bot polling ~2,000 tenants is now blocked on almost all of them; one
# polling ~50 is fine). Keep the Workday list short. SimplifyJobs is the backstop.
# ATS details verified 2026-11-24 from zshah101's company registry + its fetch
# health log (which shows which boards work from GitHub Actions) and web search.
# =============================================================================

