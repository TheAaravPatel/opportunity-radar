# Discovery through the Claude API: Claude searches the web for programs,
# pages, conferences and sources we don't track yet. NEEDS the
# ANTHROPIC_API_KEY secret, so it has no schedule: weekly discovery runs as
# a scheduled Claude Code task instead (docs/discovery-task.md +
# import-findings.yml). If you get an API key, set discovery.enabled: true
# and add a schedule here, e.g.  schedule: [{cron: "23 17 * * 0"}]
name: Weekly discovery (API key version)

on:
  workflow_dispatch: {}

permissions:
  contents: write                # save the database to the data branch
  pages: write                   # republish the dashboard
  id-token: write

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load database from the data branch
        run: bash scripts/load-db.sh
      - name: Search for new opportunities
        run: python -m radar discover
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Build dashboard
        run: python -m radar dashboard
      - name: Save database to the data branch
        run: bash scripts/save-db.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: discover
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
