# Every morning (Pacific time): registries + watched pages, dashboard, email digest.
name: Daily pages + digest

on:
  schedule:
    # 14:47 UTC = 6:47 am PST (7:47 am during daylight saving time).
    # GitHub cron is UTC-only and can start a few minutes late.
    - cron: "47 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Headless Chromium for the page-watcher, used only for pages that are
      # built by JavaScript (most pages are read with a plain request).
      - name: Install the browser for JavaScript pages
        run: python -m playwright install --with-deps chromium
      - name: Load database from the data branch
        run: bash scripts/load-db.sh
      - name: Daily sources (registries, page-watcher, econ, conferences)
        run: python -m radar fetch --group daily
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
      - name: Build dashboard
        run: python -m radar dashboard
      - name: Send the email digest
        # Never block saving the database because of an email problem.
        continue-on-error: true
        run: python -m radar digest
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
      - name: Save database to the data branch
        run: bash scripts/save-db.sh
      - name: Back up database
        uses: actions/upload-artifact@v7
        with:
          name: radar-db
          path: data/radar.db
          retention-days: 14
      # Fails with a clear message if GitHub Pages isn't turned on yet
      # (Settings -> Pages -> Source: "GitHub Actions"). The database was
      # already saved above, so nothing is lost if this step fails.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
