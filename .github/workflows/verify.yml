# Check every source and registry URL (weekly, or on demand). Writes nothing to the database.
# Run it from the Actions tab ("Verify sources" -> "Run workflow"); the report
# appears on the run's summary page.
name: Verify sources

on:
  schedule:
    - cron: "23 16 * * 0"      # Sundays 16:23 UTC: weekly check for dead or stale URLs
  workflow_dispatch:
    inputs:
      source:
        description: "Only check this source id (blank = all sources + registry URLs)"
        required: false
        default: ""
      discovery_only:
        description: "Only guess job boards for ats: unknown companies (fast)"
        type: boolean
        default: false
      probe_urls:
        description: "Debugging: space-separated public URLs to outline (skips everything else)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify
        # The input goes through an environment variable (not pasted into the
        # script) so odd input can't be run as shell code.
        run: |
          if [ -n "$PROBE_URLS" ]; then
            # Word splitting on purpose: one argument per URL.
            # shellcheck disable=SC2086
            python -m radar probe $PROBE_URLS
          elif [ "$DISCOVERY_ONLY" = "true" ]; then
            python -m radar verify --discovery-only
          elif [ -n "$ONLY_SOURCE" ]; then
            python -m radar verify --source "$ONLY_SOURCE"
          else
            python -m radar verify
          fi
        env:
          ONLY_SOURCE: ${{ inputs.source }}
          DISCOVERY_ONLY: ${{ inputs.discovery_only }}
          PROBE_URLS: ${{ inputs.probe_urls }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.probe_urls == '' }}
        with:
          name: verify-report
          path: out/verify.md
